<!DOCTYPE html>
    <html>
        <head>
            <title>bee</title>
            <style>
            body { 
                background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('Final_Hope_Lofi_Bg.webp');
                background-size:cover;
                background-position: center center;
                background-attachment: fixed;
                margin: 0;
                height: 100vh;
                }
            h1 {color:white;
               font-family:Verdana, Geneva, Tahoma, sans-serif;
                text-align:center;
                width: 260px;
                margin: 0 auto;}
            h2 {color:white;
               font-family:Verdana, Geneva, Tahoma, sans-serif;
                text-align:center;
                width: 280px;
                margin: 0 auto;}
            p {color:white;
               font-family:Verdana, Geneva, Tahoma, sans-serif;
                text-align:center;}
            .socialscontainer {
                display: flex;
                gap: 15px;
                padding: 10px;
                width: 300px;
                height: 80px;
                margin: 0 auto;
                align-items: center;}
            .social {
                padding: 10px;
                text-align: center;
                flex: 1;
                transition:transform;
                transition-duration: 0.2s;
            }
            .social:hover {
                transform: translateY(-5px)
            }
            .topnav {
                font-family:Verdana, Geneva, Tahoma, sans-serif;
                display: flex;
                background-color: #333;
                align-items: center;
                overflow: hidden;
                width:350px;
                margin: 0 auto;
                border-radius: 10px;
            }
            .topnav button {
                flex:1;
                color: #ffffff;
                background: #000008;
                background: linear-gradient(180deg,rgba(0, 0, 8, 1) 0%, rgba(0, 19, 71, 1) 100%);
                text-align: center;
                padding: 20px;
                text-decoration: none;
                font-size: 20px;
                border:none;
                border-bottom: solid white;
                transition-duration: 0.2s;
                }
            .topnav button:hover {
                background-image: none;
                background-color: #ffffff;
                color: black;
                }
            .mscontent {
                height: 70px;
                background: #000008;
                border-radius:20px;
                color: white;
                transition: 0.2s;
                cursor: pointer;
                text-align:center;
                transition-duration: all 0.2s;
                padding: 20px;
            }
            .mscontent:hover {
                transform: translateY(-5px);
                background: rgb(0, 0, 96);
            }
            .msstuff {
                display:flex;
                align-items: flex-start;
                text-align:center;
                justify-content: center;
            }
            a {
                text-decoration: none;
            }
            </style>
        </head>
        <body>
        <div class="topnav">
        <button onClick="showPage('home')">Home</button>
        <button onClick="showPage('about')">About</button>
        <button onClick="showPage('mystuff')">My Stuff</button>
        </div> 
        <br><br>
        <div id="home" style=display:block;>
        <h1>hi, i'm bee</h1>
        <br>
        <p>i like bees</p>
        <p>bees are cool</p>
        <center><img src="wibble.gif" style=border-radius:20px;></center>
        <br><br>
        <h2>my socials</h2>
        <div class="socialscontainer">
        <div class="social"><a href="https://www.youtube.com/@notxabee"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/youtube-app-white-icon.png" style=max-width:100%></a></div>
        <div class="social"><a href="https://github.com/notxabee"><img src="https://img.icons8.com/ios11/512/FFFFFF/github.png" style=max-width:100%></a></div>
        <div class="social"><a href="https://www.reddit.com/user/notxabee/"><img src="https://cdn-icons-png.flaticon.com/512/52/52053.png" style=max-width:100%;filter:invert(100%);></a></div>
        <div class="social"><a href="https://www.twitch.tv/notxabee"><img src="https://www.svgrepo.com/show/327402/logo-twitch.svg" style=max-width:100%;filter:invert(100%);></a></div>
        </div>
        </div>
        <div id="about" style=display:none;>
        <h1>About Me</h1>
        <br>
        <p>i'm bee. i like doing things.</p>
        </div>
        <div id="mystuff" style=display:none;>
        <h1>My Stuff</h1>
        <br>
        <div class="msstuff">
        <div class="mscontent"><a href="https://notxabee.github.io/challenges/"><h2>bee's challenges</h2><p>fun little OSINT challenges by me</p></a></div>
        </div>
        <br><br>
        <h2>(more coming soon!)</h2>
    </div>
        </body>
        <script>
function showPage(pageId) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('about').style.display = 'none';
document.getElementById('mystuff').style.display = 'none';
  document.getElementById(pageId).style.display = 'block';
}
        </script>
    </html>
